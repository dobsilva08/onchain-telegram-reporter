name: BTC On-Chain Intelligence

on:
  schedule:
    - cron: "25 9 * * *" # 06:25 BRT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: onchain-intelligence
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate and send standalone report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KOTE_API_KEY: ${{ secrets.KOTE_API_KEY }}
        run: python onchain_intelligence.py
      - name: Persist report history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add onchain_intelligence_history.json
          if git diff --cached --quiet; then
            echo 'History unchanged; nothing to commit.'
          else
            git commit -m 'Update BTC on-chain report history'
            git push
          fi
